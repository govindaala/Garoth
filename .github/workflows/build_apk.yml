name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android platform files & Setup App Name, Gradle, Kotlin & AdMob
        run: |
          cp lib/main.dart main_backup.dart
          flutter create . --platforms=android --org com.app.guideline --project-name garoth
          cp main_backup.dart lib/main.dart
          rm main_backup.dart
          flutter pub add supabase_flutter:^2.8.0
          flutter pub add google_mobile_ads:5.1.0
          
          # 1. Gradle version 7.6.3 set karne ki script
          python3 -c "
          gradle_path = 'android/gradle/wrapper/gradle-wrapper.properties'
          with open(gradle_path, 'r') as f:
              content = f.read()
          content = content.replace('distributionUrl=', '#distributionUrl=') + '\ndistributionUrl=https\\://services.gradle.org/distributions/gradle-7.6.3-bin.zip\n'
          with open(gradle_path, 'w' ) as f:
              f.write(content)
          "

          # 2. Kotlin version ko aggressive tareeqe se 1.8.22 update karne ki script
          python3 -c "
          import os
          for root, dirs, files in os.walk('android'):
              for file in files:
                  if file == 'build.gradle' or file == 'settings.gradle':
                      path = os.path.join(root, file)
                      with open(path, 'r') as f:
                          content = f.read()
                      # Sabhi purane kotlin versions ko 1.8.22 se replace karein
                      content = content.replace('1.4.', '1.8.')
                      content = content.replace('1.5.', '1.8.')
                      content = content.replace('1.6.', '1.8.')
                      content = content.replace('1.7.', '1.8.')
                      content = content.replace('ext.kotlin_version', 'kotlin_version')
                      with open(path, 'w') as f:
                          f.write(content)
          
          # Root build.gradle mein agar kotlin_version variable na ho toh force add karengay
          root_gradle = 'android/build.gradle'
          if os.path.exists(root_gradle):
              with open(root_gradle, 'r') as f:
                  code = f.read()
              if 'kotlin_version' not in code:
                  code = 'buildscript { ext.kotlin_version = \"1.8.22\" }\n' + code
              else:
                  code = code.replace('1.4', '1.8.22').replace('1.5', '1.8.22').replace('1.6', '1.8.22').replace('1.7', '1.8.22')
              with open(root_gradle, 'w') as f:
                  f.write(code)
          "

          # 3. App Name, Internet Permission aur AdMob App ID set karne ki script
          python3 -c "
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r') as f:
              content = f.read()
          
          content = content.replace('android:label=\"garoth\"', 'android:label=\"Collector Guideline\"')
          content = content.replace('android:label=\"guideline_app\"', 'android:label=\"Collector Guideline\"')

          if 'android.permission.INTERNET' not in content:
              content = content.replace('<application', '    <uses-permission android:name=\"android.permission.INTERNET\"/>\n    <application')
          
          admob_meta = '''
              <meta-data
                  android:name=\"com.google.android.gms.ads.APPLICATION_ID\"
                  android:value=\"ca-app-pub-1190693135801072~3753816204\"/>
          '''
          if 'com.google.android.gms.ads.APPLICATION_ID' not in content:
              content = content.replace('<application', admob_meta + '\n    <application')

          with open(manifest_path, 'w') as f:
              f.write(content)
          "

      - name: Install dependencies
        run: flutter pub get

      - name: Build Split APKs
        run: flutter build apk --release --split-per-abi

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: guideline-app-16MB
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
