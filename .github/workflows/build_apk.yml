name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android platform files
        run: |
          cp lib/main.dart main_backup.dart

          flutter create . \
            --platforms=android \
            --org com.app.guideline \
            --project-name garoth

          cp main_backup.dart lib/main.dart
          rm main_backup.dart

      - name: Add required packages
        run: |
          flutter pub add supabase_flutter:^2.8.0
          flutter pub add google_mobile_ads:5.1.0
          flutter pub add shared_preferences:^2.3.2
          flutter pub add uuid:^4.5.1

      - name: Configure AndroidManifest
        run: |
          python3 <<'PY'
          manifest_path = 'android/app/src/main/AndroidManifest.xml'

          with open(manifest_path, 'r') as f:
              content = f.read()

          # App name
          content = content.replace(
              'android:label="garoth"',
              'android:label="Collector Guideline"'
          )

          content = content.replace(
              'android:label="guideline_app"',
              'android:label="Collector Guideline"'
          )

          # Internet permission
          if 'android.permission.INTERNET' not in content:
              content = content.replace(
                  '<application',
                  '    <uses-permission android:name="android.permission.INTERNET"/>\n'
                  '    <application',
                  1
              )

          # AdMob App ID
          admob_meta = '''
              <meta-data
                  android:name="com.google.android.gms.ads.APPLICATION_ID"
                  android:value="ca-app-pub-1190693135801072~3753816204"/>
          '''

          if 'com.google.android.gms.ads.APPLICATION_ID' not in content:
              content = content.replace(
                  '<application',
                  admob_meta + '\n    <application',
                  1
              )

          with open(manifest_path, 'w') as f:
              f.write(content)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Build Split APKs
        run: flutter build apk --release --split-per-abi

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: guideline-app-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
