name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android platform files & Global .pub-cache Kotlin Override
        run: |
          cp lib/main.dart main_backup.dart
          flutter create . --platforms=android --org com.app.guideline --project-name garoth
          cp main_backup.dart lib/main.dart
          rm main_backup.dart
          
          # Zaroori packages add karein
          flutter pub add supabase_flutter:^2.8.0
          flutter pub add google_mobile_ads:5.1.0
          flutter pub add shared_preferences:^2.3.2
          flutter pub add uuid:^4.5.1
          
          # 1. Gradle version 7.6.3 set karein
          python3 -c "
          gradle_path = 'android/gradle/wrapper/gradle-wrapper.properties'
          with open(gradle_path, 'r') as f:
              content = f.read()
          content = content.replace('distributionUrl=', '#distributionUrl=') + '\ndistributionUrl=https\\://services.gradle.org/distributions/gradle-7.6.3-bin.zip\n'
          with open(gradle_path, 'w' ) as f:
              f.write(content)
          "

          # 2. GLOBAL OVERRIDE: Pub-cache aur android dono jagah se Kotlin 1.4 ko mita kar 1.8.22 karna
          python3 -c "
          import os, re
          paths_to_scan = ['android', '/home/runner/.pub-cache']
          for base_dir in paths_to_scan:
              if os.path.exists(base_dir):
                  for root, dirs, files in os.walk(base_dir):
                      for file in files:
                          if file.endswith('.gradle') or file.endswith('.properties'):
                              path = os.path.join(root, file)
                              try:
                                  with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                                      c = f.read()
                                  if '1.4' in c or 'kotlin' in c:
                                      c = c.replace('1.4.31', '1.8.22')
                                      c = c.replace('1.4.20', '1.8.22')
                                      c = c.replace('1.4', '1.8.22')
                                      c = re.sub(r'version\s*[\"\']1\.[4567]\.[0-9]+[\"\']', 'version \"1.8.22\"', c)
                                      with open(path, 'w', encoding='utf-8') as f:
                                          f.write(c)
                              except Exception as e:
                                  pass
          "

          # 3. App Name, Internet Permission aur AdMob App ID set karein
          python3 -c "
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r') as f:
              content = f.read()
          
          content = content.replace('android:label=\"garoth\"', 'android:label=\"Collector Guideline\"')
          content = content.replace('android:label=\"guideline_app\"', 'android:label=\"Collector Guideline\"')

          if 'android.permission.INTERNET' not in content:
              content = content.replace('<application', '    <uses-permission android:name=\"android.permission.INTERNET\"/>\n    <application')
          
          admob_meta = '''
              <meta-data
                  android:name=\"com.google.android.gms.ads.APPLICATION_ID\"
                  android:value=\"ca-app-pub-1190693135801072~3753816204\"/>
          '''
          if 'com.google.android.gms.ads.APPLICATION_ID' not in content:
              content = content.replace('<application', admob_meta + '\n    <application')

          with open(manifest_path, 'w') as f:
              f.write(content)
          "

      - name: Install dependencies
        run: flutter pub get

      - name: Build Split APKs
        run: flutter build apk --release --split-per-abi

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: guideline-app-16MB
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
