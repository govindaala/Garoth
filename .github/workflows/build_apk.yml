name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Setup with Gradle 7.6.3 & AdMob
        run: |
          # 1. Dependencies pehle install karein
          flutter pub get
          
          # 2. Gradle version 7.6.3 set karne ki script
          python3 -c "
          gradle_path = 'android/gradle/wrapper/gradle-wrapper.properties'
          if os.path.exists(gradle_path):
              with open(gradle_path, 'r') as f:
                  content = f.read()
              content = content.replace('distributionUrl=', '#distributionUrl=') + '\ndistributionUrl=https\\://services.gradle.org/distributions/gradle-7.6.3-bin.zip\n'
              with open(gradle_path, 'w') as f:
                  f.write(content)
          "

          # 3. AndroidManifest mein Internet aur AdMob ID dalna
          python3 -c "
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r') as f:
                  content = f.read()
              
              content = content.replace('android:label=\"garoth\"', 'android:label=\"Collector Guideline\"')
              content = content.replace('android:label=\"guideline_app\"', 'android:label=\"Collector Guideline\"')

              if 'android.permission.INTERNET' not in content:
                  content = content.replace('<application', '    <uses-permission android:name=\"android.permission.INTERNET\"/>\n    <application')
              
              admob_meta = '''
                  <meta-data
                      android:name=\"com.google.android.gms.ads.APPLICATION_ID\"
                      android:value=\"ca-app-pub-1190693135801072~3753816204\"/>
              '''
              if 'com.google.android.gms.ads.APPLICATION_ID' not in content:
                  content = content.replace('<application', admob_meta + '\n    <application')

              with open(manifest_path, 'w') as f:
                  f.write(content)
          "

      - name: Build Split APKs
        run: flutter build apk --release --split-per-abi

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: guideline-app-16MB
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
