name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android platform files & Force Kotlin & Gradle Fix
        run: |
          cp lib/main.dart main_backup.dart
          flutter create . --platforms=android --org com.app.guideline --project-name garoth
          cp main_backup.dart lib/main.dart
          rm main_backup.dart
          flutter pub add supabase_flutter:^2.8.0
          flutter pub add google_mobile_ads:5.1.0
          
          # 1. Gradle version 7.6.3 set karne ki script
          python3 -c "
          gradle_path = 'android/gradle/wrapper/gradle-wrapper.properties'
          with open(gradle_path, 'r') as f:
              content = f.read()
          content = content.replace('distributionUrl=', '#distributionUrl=') + '\ndistributionUrl=https\\://services.gradle.org/distributions/gradle-7.6.3-bin.zip\n'
          with open(gradle_path, 'w' ) as f:
              f.write(content)
          "

          # 2. Latest Fix: gradle.properties mein Kotlin version ko forcefully 1.8.22 lock karna
          python3 -c "
          import os
          prop_path = 'android/gradle.properties'
          new_prop = '\nkotlin.version=1.8.22\nandroid.useAndroidX=true\nandroid.enableJetifier=true\n'
          if os.path.exists(prop_path):
              with open(prop_path, 'r') as f:
                  c = f.read()
              if 'kotlin.version' not in c:
                  with open(prop_path, 'a') as f:
                      f.write(new_prop)
          else:
              with open(prop_path, 'w') as f:
                  f.write(new_prop)
          "

          # 3. Sabhi build.gradle files mein se purana 1.4 version hatane ki script
          python3 -c "
          import os
          for root, dirs, files in os.walk('android'):
              for file in files:
                  if file == 'build.gradle' or file == 'settings.gradle':
                      path = os.path.join(root, file)
                      with open(path, 'r') as f:
                          content = f.read()
                      content = content.replace('1.4.', '1.8.')
                      content = content.replace('1.5.', '1.8.')
                      content = content.replace('1.6.', '1.8.')
                      content = content.replace('1.7.', '1.8.')
                      with open(path, 'w') as f:
                          f.write(content)
          "

          # 4. App Name, Internet Permission aur AdMob App ID set karne ki script
          python3 -c "
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r') as f:
              content = f.read()
          
          content = content.replace('android:label=\"garoth\"', 'android:label=\"Collector Guideline\"')
          content = content.replace('android:label=\"guideline_app\"', 'android:label=\"Collector Guideline\"')

          if 'android.permission.INTERNET' not in content:
              content = content.replace('<application', '    <uses-permission android:name=\"android.permission.INTERNET\"/>\n    <application')
          
          admob_meta = '''
              <meta-data
                  android:name=\"com.google.android.gms.ads.APPLICATION_ID\"
                  android:value=\"ca-app-pub-1190693135801072~3753816204\"/>
          '''
          if 'com.google.android.gms.ads.APPLICATION_ID' not in content:
              content = content.replace('<application', admob_meta + '\n    <application')

          with open(manifest_path, 'w') as f:
              f.write(content)
          "

      - name: Install dependencies
        run: flutter pub get

      - name: Build Split APKs
        run: flutter build apk --release --split-per-abi

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: guideline-app-16MB
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
