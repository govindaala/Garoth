<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MP Collector Guideline - Super Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0b1329; margin: 0; padding: 16px; color: #f8fafc; }
    .card { max-width: 900px; margin: 0 auto; background: #16203c; padding: 20px; border-radius: 14px; border: 1px solid #2e3e6b; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h1 { color: #38bdf8; font-size: 19px; margin-top: 0; border-bottom: 1px solid #2e3e6b; padding-bottom: 12px; }
    label { font-size: 13px; font-weight: 600; color: #94a3b8; display: block; margin-bottom: 6px; }
    input, select { width: 100%; padding: 12px; border: 1px solid #3b4d7a; border-radius: 8px; font-size: 14px; background: #0b1329; color: #fff; margin-bottom: 15px; }
    
    .upload-btn {
      display: block; border: 2px dashed #0284c7; border-radius: 10px; padding: 25px 15px;
      text-align: center; background: #0b1329; cursor: pointer; margin-bottom: 15px;
    }
    .upload-btn:active { background: #1e2e5a; }
    input[type="file"] { display: none; }
    
    .stats-row { display: flex; gap: 10px; margin: 15px 0; }
    .stat-item { background: #0b1329; padding: 12px; border-radius: 8px; border: 1px solid #2e3e6b; flex: 1; text-align: center; }
    .stat-val { font-size: 20px; font-weight: bold; color: #38bdf8; }
    .stat-lbl { font-size: 11px; color: #94a3b8; margin-top: 2px; }
    
    .btn { background: #0284c7; color: #fff; border: none; padding: 14px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; width: 100%; }
    .btn-green { background: #16a34a; margin-top: 10px; }
    .btn:disabled { opacity: 0.5; }
    
    .progress-bar-bg { width: 100%; background: #2e3e6b; height: 12px; border-radius: 6px; overflow: hidden; margin-top: 14px; display: none; }
    .progress-bar-fill { width: 0%; height: 100%; background: #22c55e; transition: width 0.1s; }
    #msg { margin-top: 12px; font-size: 13px; font-weight: 600; line-height: 1.4; }
  </style>
</head>
<body>

<div class="card">
  <h1>🏛️ एमपी कलेक्टर गाइडलाइन (16 दरें अपलोडर)</h1>

  <label>1. ज़िला चुनें (Select District)</label>
  <select id="districtSelect" onchange="checkCustom(this.value)">
    <option value="मंदसौर">मंदसौर (Mandsaur)</option>
    <option value="आगर मालवा">आगर मालवा (Agar Malwa)</option>
    <option value="रतलाम">रतलाम (Ratlam)</option>
    <option value="उज्जैन">उज्जैन (Ujjain)</option>
    <option value="इंदौर">इंदौर (Indore)</option>
    <option value="शाजापुर">शाजापुर (Shajapur)</option>
    <option value="CUSTOM">➕ नया ज़िला लिखें...</option>
  </select>
  <input type="text" id="customDistrict" placeholder="ज़िले का नाम दर्ज करें" style="display:none;">

  <label>2. .txt फ़ाइल चुनें (Choose File)</label>
  <label class="upload-btn" for="txtFile">
    <div style="font-size: 32px;">📂</div>
    <div id="fileTxt" style="font-weight: 600; color: #38bdf8; margin-top: 6px;">यहाँ टैप करके .txt फ़ाइल चुनें</div>
    <div style="font-size: 11px; color: #94a3b8; margin-top: 4px;">(Mandsaur_2026-27_300_pages_copy_format.txt)</div>
  </label>
  <input type="file" id="txtFile" accept=".txt,text/plain,*/*" onchange="readFile(event)">

  <div class="stats-row" id="statsBox" style="display:none;">
    <div class="stat-item"><div class="stat-val" id="cntRows">0</div><div class="stat-lbl">कुल रिकॉर्ड्स</div></div>
    <div class="stat-item"><div class="stat-val" id="cntTehsils">0</div><div class="stat-lbl">तहसीलें मिलीं</div></div>
    <div class="stat-item"><div class="stat-val" id="cntWards">0</div><div class="stat-lbl">वार्ड / हल्के</div></div>
  </div>

  <div class="progress-bar-bg" id="pBarBg"><div class="progress-bar-fill" id="pBarFill"></div></div>
  <div id="msg"></div>

  <button class="btn btn-green" id="saveBtn" style="display:none;" onclick="uploadData()">
    🚀 पुराना हटाकर नया 16 दरों का डेटा सेव करें
  </button>
</div>

<script>
  const SUPABASE_URL = "https://dcbtdftgjyokioqcpumv.supabase.co";
  const SUPABASE_KEY = "sb_publishable_u6nxcL145Z-HsaKiOlfjoQ_DCvKJrGO";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let rowsToSave = [];

  function checkCustom(v) {
    document.getElementById('customDistrict').style.display = (v === 'CUSTOM') ? 'block' : 'none';
  }

  function getDistrict() {
    const s = document.getElementById('districtSelect').value;
    return (s === 'CUSTOM') ? (document.getElementById('customDistrict').value.trim() || 'मंदसौर') : s;
  }

  function clean(s) {
    return (s || '').replace(/[\r\n\t]+/g, ' ').trim();
  }

  function readFile(e) {
    const f = e.target.files[0];
    if (!f) return;

    document.getElementById('fileTxt').innerText = "📄 " + f.name;
    document.getElementById('msg').innerHTML = "<span style='color:#38bdf8;'>⏳ फ़ाइल पढ़ी जा रही है...</span>";

    const r = new FileReader();
    r.onload = function(evt) {
      let t = evt.target.result || "";
      if (t.charCodeAt(0) === 0xFEFF) t = t.slice(1);
      parse(t);
    };
    r.readAsText(f, "UTF-8");
  }

  function parse(text) {
    const dist = getDistrict();
    const lines = text.split(/\r?\n/);
    rowsToSave = [];

    let cTehsil = "सामान्य";
    let cSub = "सामान्य";
    let cWard = "वार्ड 01";

    const tehsils = new Set();
    const wards = new Set();

    for (let i = 0; i < lines.length; i++) {
      let l = lines[i].trim();
      if (!l) continue;

      if (l.startsWith("Tehsil :") || l.startsWith("तहसील :")) {
        cTehsil = clean(l.split(":")[1]);
        tehsils.add(cTehsil);
        continue;
      }
      if (l.startsWith("Sub-Area :") || l.startsWith("उप-क्षेत्र :") || l.startsWith("निकाय :")) {
        cSub = clean(l.split(":")[1]);
        continue;
      }
      if (l.startsWith("Ward :") || l.startsWith("वार्ड :") || l.startsWith("Patwari Halka :") || l.startsWith("पटवारी हल्का :")) {
        cWard = clean(l.split(":")[1]);
        wards.add(cWard);
        continue;
      }

      if (l.includes('|')) {
        const p = l.split('|').map(x => clean(x));
        if (p.length >= 5 && /^\d+$/.test(p[0])) {
          let loc = p[1] || ("वार्ड का शेष भाग (" + p[0] + ")");
          const n = [];
          for (let j = 2; j < p.length; j++) {
            let v = p[j].replace(/[₹,]/g, '').trim();
            n.push(v && v !== "None" ? v : "-");
          }

          rowsToSave.push({
            district: dist,
            tehsil: cTehsil,
            sub_area: cSub,
            ward_halka: cWard,
            village: cSub,
            ward: loc.substring(0, 90),
            location_name: loc.substring(0, 90),
            plot_residential: n[0] || "-",
            plot_commercial: n[1] || "-",
            plot_industrial: n[2] || "-",
            rcc_residential: n[3] || "-",
            pucca_residential: n[4] || "-",
            semi_pucca_residential: n[5] || "-",
            kachha_residential: n[6] || "-",
            shop_rcc: n[7] || "-",
            shop_pucca: n[8] || "-",
            shop_semi_pucca: n[9] || "-",
            multi_residential: n[10] || "-",
            multi_commercial: n[11] || "-",
            agri_irrigated: n[12] || "-",
            agri_unirrigated: n[13] || "-",
            extra_rate_1: n[14] || "-",
            extra_rate_2: n[15] || "-"
          });
        }
      }
    }

    if (rowsToSave.length === 0) {
      document.getElementById('msg').innerHTML = "<span style='color:#ef4444;'>❌ फ़ाइल में कोई रिकॉर्ड नहीं मिला। फ़ॉर्मेट जाँचें।</span>";
      return;
    }

    document.getElementById('cntRows').innerText = rowsToSave.length;
    document.getElementById('cntTehsils').innerText = tehsils.size;
    document.getElementById('cntWards').innerText = wards.size;
    document.getElementById('statsBox').style.display = 'flex';
    document.getElementById('saveBtn').style.display = 'block';
    document.getElementById('msg').innerHTML = `<span style='color:#22c55e;'>✅ ${rowsToSave.length} रिकॉर्ड्स तैयार हैं! अब नीचे हरा बटन दबाएँ।</span>`;
  }

  async function uploadData() {
    if (rowsToSave.length === 0) return;
    const dist = getDistrict();
    const btn = document.getElementById('saveBtn');
    btn.disabled = true;
    btn.innerText = "डेटा सेव हो रहा है...";

    const pBg = document.getElementById('pBarBg');
    const pFill = document.getElementById('pBarFill');
    const msg = document.getElementById('msg');
    pBg.style.display = 'block';

    try {
      msg.innerHTML = `<span style="color:#f59e0b;">⏳ ज़िला "${dist}" का पुराना डेटा साफ़ किया जा रहा है...</span>`;
      
      // पुराना डेटा साफ़ करें
      await supabase.from('guidelines').delete().eq('district', dist);

      // सुरक्षित 50 रिकॉर्ड्स का बैच
      const BATCH = 50;
      const total = rowsToSave.length;

      for (let i = 0; i < total; i += BATCH) {
        const chunk = rowsToSave.slice(i, i + BATCH);
        const { error } = await supabase.from('guidelines').insert(chunk);
        if (error) throw error;

        const done = Math.min(i + BATCH, total);
        const pct = Math.round((done / total) * 100);
        pFill.style.width = pct + '%';
        msg.innerHTML = `<span style="color:#38bdf8;">सेव हो रहा है: ${done} / ${total} (${pct}%)...</span>`;
        await new Promise(r => setTimeout(r, 30));
      }

      msg.innerHTML = `<span style="color:#22c55e; font-size:15px;">🎉 बधाई हो! ज़िला "${dist}" के सभी ${total} रिकॉर्ड्स Supabase में बिना किसी रुकावट के सेव हो चुके हैं!</span>`;
      btn.style.display = 'none';

    } catch (err) {
      msg.innerHTML = `<span style="color:#ef4444;">❌ अपलोड त्रुटि: ${err.message || JSON.stringify(err)}</span>`;
      btn.disabled = false;
      btn.innerText = "पुनः प्रयास करें";
    }
  }
</script>
</body>
</html>
