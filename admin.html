<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MP Collector Guideline - Admin Panel</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #f1f5f9; margin: 0; padding: 20px; color: #1e293b; }
    .container { max-width: 1100px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    h1 { color: #1e3a8a; margin-top: 0; font-size: 22px; border-bottom: 2px solid #e2e8f0; padding-bottom: 12px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 20px; }
    label { font-size: 13px; font-weight: bold; color: #475569; display: block; margin-bottom: 5px; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
    textarea { height: 160px; font-family: monospace; font-size: 13px; white-space: pre; }
    .btn { background: #1e3a8a; color: #fff; border: none; padding: 12px 24px; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn:hover { background: #1d4ed8; }
    .btn-clear { background: #64748b; margin-left: 10px; }
    .preview-box { margin-top: 25px; overflow-x: auto; max-height: 400px; border: 1px solid #e2e8f0; border-radius: 8px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { border: 1px solid #e2e8f0; padding: 8px 12px; text-align: left; }
    th { background: #f8fafc; color: #334155; position: sticky; top: 0; }
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    .badge-success { background: #dcfce7; color: #166534; }
    .badge-info { background: #e0f2fe; color: #075985; }
    #status { margin-top: 15px; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <h1>🏛️ एमपी कलेक्टर गाइडलाइन - सुपर एडमिन पैनल</h1>

  <!-- 1. स्थान चयन ग्रिड -->
  <div class="grid">
    <div>
      <label>1. ज़िला (District)</label>
      <select id="districtSelect" onchange="checkCustomDistrict(this.value)">
        <option value="मंदसौर">मंदसौर (Mandsaur)</option>
        <option value="आगर मालवा">आगर मालवा (Agar Malwa)</option>
        <option value="रतलाम">रतलाम (Ratlam)</option>
        <option value="उज्जैन">उज्जैन (Ujjain)</option>
        <option value="इंदौर">इंदौर (Indore)</option>
        <option value="शाजापुर">शाजापुर (Shajapur)</option>
        <option value="CUSTOM">➕ नया ज़िला टाइप करें...</option>
      </select>
      <input type="text" id="customDistrict" placeholder="नए ज़िले का नाम दर्ज करें" style="display:none; margin-top:5px;">
    </div>

    <div>
      <label>2. तहसील (Tehsil)</label>
      <input type="text" id="tehsilInput" placeholder="उदा. गरोठ, शामगढ़, मंदसौर">
    </div>

    <div>
      <label>3. निकाय / उप-क्षेत्र (Sub-Area)</label>
      <input type="text" id="subAreaInput" placeholder="उदा. नगर परिषद गरोठ या ग्रामीण">
    </div>

    <div>
      <label>4. वार्ड / हल्का नंबर (Ward / Halka)</label>
      <input type="text" id="wardInput" placeholder="उदा. वार्ड नं. 01 या हल्का नं. 14">
    </div>
  </div>

  <!-- 2. AI से प्राप्त टेक्स्ट पेस्ट बॉक्स -->
  <label>5. यहाँ AI से प्राप्त टेक्स्ट/टेबल पेस्ट करें (Paste Raw Text from AI)</label>
  <textarea id="rawInput" placeholder="उदा.
1 | BRIJDHAM COLONY | 3500 | 5500 | 3500 | 10500 | 17500 | 16500 | 9800 | 16400 | 1650000 | 1650000
2 | CHAMBAL CHOURAHA | 4500 | 7000 | 4500 | 11500 | 19000 | 18000 | 10600 | 17600 | 1650000 | 1650000"></textarea>

  <div style="margin-top: 15px;">
    <button class="btn" onclick="parseText()">🔍 डेटा चेक करें (Preview)</button>
    <button class="btn btn-clear" onclick="clearAll()">साफ़ करें (Clear)</button>
    <button class="btn" id="uploadBtn" style="background:#16a34a; display:none;" onclick="uploadToSupabase()">🚀 Supabase में सेव करें</button>
  </div>

  <div id="status"></div>

  <!-- 3. लाइव प्रीव्यू टेबल -->
  <div class="preview-box" id="previewContainer" style="display:none;">
    <table>
      <thead>
        <tr>
          <th>क्र.</th>
          <th>कॉलोनी / सड़क / गाँव</th>
          <th>आवासीय भूखण्ड</th>
          <th>व्यावसायिक भूखण्ड</th>
          <th>RCC निर्माण</th>
          <th>दुकान निर्माण</th>
          <th>कृषि सिंचित (₹/हेक्टेयर)</th>
          <th>कृषि असिंचित (₹/हेक्टेयर)</th>
        </tr>
      </thead>
      <tbody id="previewBody"></tbody>
    </table>
  </div>
</div>

<script>
  // Supabase कनेक्शन
  const SUPABASE_URL = "https://dcbtdftgjyokioqcpumv.supabase.co";
  const SUPABASE_KEY = "sb_publishable_u6nxcL145Z-HsaKiOlfjoQ_DCvKJrGO";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let parsedRecords = [];

  function checkCustomDistrict(val) {
    document.getElementById('customDistrict').style.display = (val === 'CUSTOM') ? 'block' : 'none';
  }

  function getActiveDistrict() {
    const sel = document.getElementById('districtSelect').value;
    if (sel === 'CUSTOM') {
      return document.getElementById('customDistrict').value.trim() || 'मध्य प्रदेश';
    }
    return sel;
  }

  // स्मार्ट पार्सर: AI टेक्स्ट से कॉलम अलग करना
  function parseText() {
    const raw = document.getElementById('rawInput').value.trim();
    const tehsil = document.getElementById('tehsilInput').value.trim() || "सामान्य";
    const subArea = document.getElementById('subAreaInput').value.trim() || "सामान्य";
    const ward = document.getElementById('wardInput').value.trim() || "वार्ड 01";
    const district = getActiveDistrict();

    if (!raw) {
      alert("कृपया पहले AI से प्राप्त डेटा पेस्ट करें!");
      return;
    }

    const lines = raw.split('\n');
    parsedRecords = [];
    const tbody = document.getElementById('previewBody');
    tbody.innerHTML = '';

    lines.forEach((line) => {
      let l = line.trim();
      if (!l || l.includes('Plot Value') || l.includes('Residential') || l.includes('क्र.')) return;

      // टोकन अलग करें (पाइप |, टैब \t या कॉमा से)
      let parts = [];
      if (l.includes('|')) {
        parts = l.split('|').map(p => p.trim());
      } else if (l.includes('\t')) {
        parts = l.split('\t').map(p => p.trim());
      } else {
        parts = l.split(/\s{2,}/).map(p => p.trim());
      }

      // पहला सेल अगर सीरियल नंबर हो तो हटाएँ
      let locIndex = 0;
      if (/^\d+$/.test(parts[0])) locIndex = 1;

      const locName = parts[locIndex] || "";
      if (!locName || locName.length < 2) return;

      // शेष संख्याओं को इकट्ठा करें
      const nums = [];
      for (let i = locIndex + 1; i < parts.length; i++) {
        const cleaned = parts[i].replace(/[₹,]/g, '').trim();
        const m = cleaned.match(/\d+/);
        nums.push(m ? m[0] : "-");
      }

      // 18-कॉलम संरचना मैपिंग
      const record = {
        district: district,
        tehsil: tehsil,
        sub_area: subArea,
        ward_halka: ward,
        village: subArea,
        ward: locName.substring(0, 90),
        location_name: locName.substring(0, 90),
        plot_residential: nums[0] || "-",
        plot_commercial: nums[1] || "-",
        plot_industrial: nums[2] || "-",
        rcc_rate: nums[3] || "-",
        shop_rate: nums[4] || "-",
        office_rate: nums[5] || "-",
        multi_res: nums[6] || "-",
        multi_comm: nums[7] || "-",
        agri_irrigated: nums[8] || "-",
        agri_unirrigated: nums[9] || "-"
      };

      parsedRecords.push(record);

      // प्रीव्यू टेबल रो
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${parsedRecords.length}</td>
        <td><b>${record.location_name}</b></td>
        <td>₹ ${record.plot_residential}</td>
        <td>₹ ${record.plot_commercial}</td>
        <td>₹ ${record.rcc_rate}</td>
        <td>₹ ${record.shop_rate}</td>
        <td style="color:#166534; font-weight:bold;">₹ ${record.agri_irrigated}</td>
        <td style="color:#b45309; font-weight:bold;">₹ ${record.agri_unirrigated}</td>
      `;
      tbody.appendChild(tr);
    });

    if (parsedRecords.length > 0) {
      document.getElementById('previewContainer').style.display = 'block';
      document.getElementById('uploadBtn').style.display = 'inline-block';
      document.getElementById('status').innerHTML = `<span class="badge badge-info">कुल ${parsedRecords.length} कॉलोनियों/गाँवों का डेटा तैयार है। नीचे प्रीव्यू जाँचें।</span>`;
    } else {
      alert("डेटा सही से पार्स नहीं हो पाया। कृपया फ़ॉर्मेट जाँचें।");
    }
  }

  // Supabase में सीधा बैच अपलोड
  async function uploadToSupabase() {
    if (parsedRecords.length === 0) return;
    const btn = document.getElementById('uploadBtn');
    btn.disabled = true;
    btn.innerText = "अपलोड हो रहा है...";
    const status = document.getElementById('status');

    try {
      const batchSize = 100;
      for (let i = 0; i < parsedRecords.length; i += batchSize) {
        const batch = parsedRecords.slice(i, i + batchSize);
        const { error } = await supabaseClient.from('guidelines').insert(batch);
        if (error) throw error;
        status.innerHTML = `<span class="badge badge-info">अपलोड हो रहा है: ${Math.min(i + batchSize, parsedRecords.length)} / ${parsedRecords.length} पंक्तियाँ...</span>`;
      }

      status.innerHTML = `<span class="badge badge-success">🎉 बधाई हो! सभी ${parsedRecords.length} रिकॉर्ड्स Supabase में सफलतापूर्वक सेव हो गए!</span>`;
      btn.style.display = 'none';
      document.getElementById('rawInput').value = '';
    } catch (err) {
      alert("अपलोड में त्रुटि: " + err.message);
      status.innerHTML = `<span style="color:red;">Error: ${err.message}</span>`;
      btn.disabled = false;
      btn.innerText = "पुनः प्रयास करें";
    }
  }

  function clearAll() {
    document.getElementById('rawInput').value = '';
    document.getElementById('previewBody').innerHTML = '';
    document.getElementById('previewContainer').style.display = 'none';
    document.getElementById('uploadBtn').style.display = 'none';
    document.getElementById('status').innerHTML = '';
  }
</script>
</body>
</html>
