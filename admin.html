<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MP Collector Guideline - Fast File Uploader</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0f172a; margin: 0; padding: 20px; color: #f8fafc; }
    .container { max-width: 1000px; margin: 0 auto; background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h1 { color: #38bdf8; margin-top: 0; font-size: 20px; border-bottom: 1px solid #334155; padding-bottom: 12px; }
    .upload-zone { border: 2px dashed #38bdf8; border-radius: 10px; padding: 30px; text-align: center; background: #0f172a; margin: 20px 0; cursor: pointer; }
    .upload-zone:hover { background: #1e293b; }
    input[type="file"] { display: none; }
    .btn { background: #0284c7; color: #fff; border: none; padding: 12px 24px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; }
    .btn-green { background: #16a34a; }
    .summary-card { display: flex; gap: 15px; margin: 15px 0; flex-wrap: wrap; }
    .stat-box { background: #0f172a; padding: 12px 20px; border-radius: 8px; border: 1px solid #334155; flex: 1; }
    .stat-num { font-size: 22px; font-weight: bold; color: #38bdf8; }
    .stat-label { font-size: 12px; color: #94a3b8; }
    .progress-bar-container { width: 100%; background: #334155; height: 12px; border-radius: 6px; overflow: hidden; margin-top: 15px; display: none; }
    .progress-bar { width: 0%; height: 100%; background: #22c55e; transition: width 0.1s; }
    #status { margin-top: 12px; font-weight: bold; font-size: 14px; }
  </style>
</head>
<body>

<div class="container">
  <h1>⚡ कलेक्टर गाइडलाइन - डायरेक्ट फ़ाइल अपलोडर</h1>

  <div style="margin-bottom: 15px;">
    <label style="font-size: 13px; color: #94a3b8; font-weight: bold;">ज़िले का नाम दर्ज करें:</label>
    <input type="text" id="districtName" value="मंदसौर" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; margin-top: 6px;">
  </div>

  <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
    <div style="font-size: 40px;">📁</div>
    <div style="font-weight: bold; margin-top: 10px; color: #38bdf8;">यहाँ क्लिक करके अपनी .txt फ़ाइल चुनें</div>
    <div style="font-size: 12px; color: #94a3b8; margin-top: 4px;">(Mandsaur_2026-27_300_pages_copy_format.txt)</div>
    <input type="file" id="fileInput" accept=".txt" onchange="handleFile(this.files[0])">
  </div>

  <div class="summary-card" id="summaryCard" style="display:none;">
    <div class="stat-box"><div class="stat-num" id="statRows">0</div><div class="stat-label">कुल रिकॉर्ड्स (Rows)</div></div>
    <div class="stat-box"><div class="stat-num" id="statTehsils">0</div><div class="stat-label">तहसीलें मिलीं</div></div>
    <div class="stat-box"><div class="stat-num" id="statWards">0</div><div class="stat-label">वार्ड / पटवारी हल्के</div></div>
  </div>

  <div class="progress-bar-container" id="progressContainer">
    <div class="progress-bar" id="progressBar"></div>
  </div>
  <div id="status"></div>

  <button class="btn btn-green" id="uploadBtn" style="display:none; width: 100%; margin-top: 15px;" onclick="uploadToSupabase()">
    🚀 Supabase में डेटा सेव करें
  </button>
</div>

<script>
  const SUPABASE_URL = "https://dcbtdftgjyokioqcpumv.supabase.co";
  const SUPABASE_KEY = "sb_publishable_u6nxcL145Z-HsaKiOlfjoQ_DCvKJrGO";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let parsedRecords = [];

  function cleanStr(s) {
    return (s || '').replace(/[\r\n\t]+/g, ' ').trim();
  }

  function handleFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      processText(e.target.result);
    };
    reader.readAsText(file, "UTF-8");
  }

  function processText(text) {
    const district = document.getElementById('districtName').value.trim() || 'मंदसौर';
    const lines = text.split('\n');
    parsedRecords = [];

    let curTehsil = "सामान्य";
    let curSubArea = "सामान्य";
    let curWard = "वार्ड 01";

    const tehsils = new Set();
    const wards = new Set();

    for (let i = 0; i < lines.length; i++) {
      let l = lines[i].trim();
      if (!l) continue;

      // 1. हेडर डिटेक्शन
      if (l.startsWith("Tehsil :")) {
        curTehsil = cleanStr(l.replace("Tehsil :", ""));
        tehsils.add(curTehsil);
        continue;
      }
      if (l.startsWith("Sub-Area :")) {
        curSubArea = cleanStr(l.replace("Sub-Area :", ""));
        continue;
      }
      if (l.startsWith("Ward :") || l.startsWith("Patwari Halka :")) {
        curWard = cleanStr(l.replace(/(?:Ward|Patwari Halka)\s*:/, ""));
        wards.add(curWard);
        continue;
      }

      // 2. डेटा पंक्ति डिटेक्शन
      if (l.includes('|')) {
        let parts = l.split('|').map(p => cleanStr(p));
        if (parts.length >= 5 && /^\d+$/.test(parts[0])) {
          let locName = parts[1];
          if (!locName || locName === "") {
            locName = "वार्ड का शेष भाग (क्र. " + parts[0] + ")";
          }

          const nums = [];
          for (let j = 2; j < parts.length; j++) {
            let val = parts[j].replace(/[₹,]/g, '').trim();
            nums.push(val && val !== "None" ? val : "-");
          }

          parsedRecords.push({
            district: district,
            tehsil: curTehsil,
            sub_area: curSubArea,
            ward_halka: curWard,
            village: curSubArea,
            ward: locName.substring(0, 90),
            location_name: locName.substring(0, 90),
            plot_residential: nums[0] || "-",
            plot_commercial: nums[1] || "-",
            plot_industrial: nums[2] || "-",
            rcc_rate: nums[3] || "-",
            shop_rate: nums[7] || "-",
            office_rate: nums[8] || "-",
            multi_res: nums[10] || "-",
            multi_comm: nums[11] || "-",
            agri_irrigated: nums[12] || "-",
            agri_unirrigated: nums[13] || "-"
          });
        }
      }
    }

    document.getElementById('statRows').innerText = parsedRecords.length;
    document.getElementById('statTehsils').innerText = tehsils.size;
    document.getElementById('statWards').innerText = wards.size;
    document.getElementById('summaryCard').style.display = 'flex';
    document.getElementById('uploadBtn').style.display = 'block';
    document.getElementById('status').innerHTML = `<span style="color:#38bdf8;">✅ फ़ाइल प्रोसेस हो गई: कुल ${parsedRecords.length} कॉलोनियों/गाँवों का डेटा तैयार है!</span>`;
  }

  async function uploadToSupabase() {
    const btn = document.getElementById('uploadBtn');
    btn.disabled = true;
    btn.innerText = "डेटाबेस में सेव हो रहा है...";

    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const status = document.getElementById('status');
    progressContainer.style.display = 'block';

    const batchSize = 250;
    const total = parsedRecords.length;

    try {
      for (let i = 0; i < total; i += batchSize) {
        const batch = parsedRecords.slice(i, i + batchSize);
        const { error } = await supabaseClient.from('guidelines').insert(batch);
        if (error) throw error;

        const currentDone = Math.min(i + batchSize, total);
        const pct = Math.round((currentDone / total) * 100);
        progressBar.style.width = pct + '%';
        status.innerHTML = `<span style="color:#38bdf8;">सेव हो रहा है: ${currentDone} / ${total} (${pct}%)...</span>`;
        await new Promise(r => setTimeout(r, 40));
      }

      status.innerHTML = `<span style="color:#22c55e;">🎉 बधाई हो! सभी ${total} रिकॉर्ड्स Supabase में बिना किसी त्रुटि के सेव हो गए!</span>`;
      btn.style.display = 'none';
    } catch (err) {
      alert("अपलोड त्रुटि: " + err.message);
      status.innerHTML = `<span style="color:#ef4444;">Error: ${err.message}</span>`;
      btn.disabled = false;
      btn.innerText = "पुनः प्रयास करें";
    }
  }
</script>
</body>
</html>
